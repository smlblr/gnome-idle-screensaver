[package]
name = "gnome-idle-screensaver"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Idle screensaver for GNOME on Wayland"
publish = false
license = "MIT"
repository = "https://github.com/smlblr/gnome-idle-screensaver"
homepage = "https://github.com/smlblr/gnome-idle-screensaver"
readme = "README.md"
keywords = ["gnome", "wayland", "screensaver", "gtk4", "libadwaita"]
categories = ["gui"]

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
glow = "0.18.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[profile.release]
strip = true
