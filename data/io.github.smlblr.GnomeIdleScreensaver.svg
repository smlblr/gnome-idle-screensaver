<?xml version="1.0" encoding="UTF-8"?>
<!-- The three glxgears gears, placed and sized as in the demo (scaled 6.8 px per unit). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3048"/>
      <stop offset="1" stop-color="#11141f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#screen)"/>

  <!-- red: gear(1.0, 4.0, 1.0, 20, 0.7) at (-3, -2) -->
  <g fill="#cc1a00" stroke="#cc1a00">
    <circle cx="50.06" cy="78.28" r="26.95" fill="none" stroke-width="5.3" stroke-dasharray="3.80 4.67" transform="rotate(4 50.06 78.28)"/>
    <path fill-rule="evenodd" stroke="none" d="M25.24 78.28a24.82 24.82 0 1 0 49.64 0a24.82 24.82 0 1 0-49.64 0ZM43.26 78.28a6.8 6.8 0 1 0 13.6 0a6.8 6.8 0 1 0-13.6 0Z"/>
  </g>
  <!-- green: gear(0.5, 2.0, 2.0, 10, 0.7) at (3.1, -2) -->
  <g fill="#00cc33" stroke="#00cc33">
    <circle cx="91.54" cy="78.28" r="13.35" fill="none" stroke-width="5.3" stroke-dasharray="3.77 4.62" transform="rotate(12 91.54 78.28)"/>
    <path fill-rule="evenodd" stroke="none" d="M80.32 78.28a11.22 11.22 0 1 0 22.44 0a11.22 11.22 0 1 0-22.44 0ZM88.14 78.28a3.4 3.4 0 1 0 6.8 0a3.4 3.4 0 1 0-6.8 0Z"/>
  </g>
  <!-- blue: gear(1.3, 2.0, 0.5, 10, 0.7) at (-3.1, 4.2) -->
  <g fill="#3a3aff" stroke="#3a3aff">
    <circle cx="49.38" cy="36.12" r="13.35" fill="none" stroke-width="5.3" stroke-dasharray="3.77 4.62" transform="rotate(-7 49.38 36.12)"/>
    <path fill-rule="evenodd" stroke="none" d="M38.16 36.12a11.22 11.22 0 1 0 22.44 0a11.22 11.22 0 1 0-22.44 0ZM40.54 36.12a8.84 8.84 0 1 0 17.68 0a8.84 8.84 0 1 0-17.68 0Z"/>
  </g>

  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#shine)"/>
</svg>
