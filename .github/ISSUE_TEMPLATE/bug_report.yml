name: Bug report
description: The screensaver does not start, does not close, or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit if built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, GNOME version, GPU, number of monitors
      placeholder: Ubuntu 24.04, GNOME 46, Intel UHD 630, one monitor
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [".deb from a release", "install.sh from source", "other"]
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: The "Status" section of the settings window
      description: It lists what currently prevents idle. If the screensaver never starts, paste it here.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `journalctl --user -b | grep gnome-idle-screensaver`
      render: text
